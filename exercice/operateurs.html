    <!-- * Script structures de contrôle conditionnelles if, if...else et if...else if...else -->

        // if
        let x = 4;
        let y = 0;

        if (x > 1) {
            alert('x est sup à 1');
        }   // l'alerte fonctionnera que si x est sup à 1


        if (x == y) {
            alert('x et y même valeur')
        }   // l'alerte ne fonctionne pas car x est différent de y


        if (y) {
            alert('y est true')
        }   // normal que cela n'affiche rien
